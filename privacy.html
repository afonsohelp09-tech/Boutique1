<!DOCTYPE html>
<html lang="pt-PT" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<link rel="icon" href="favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" sizes="200x200" href="icons/icon-200.png"/>
<meta name="robots" content="index, follow"/>
<meta name="theme-color" content="#0b0a09" id="metaThemeColor"/>
<title>Política de Privacidade — AZAVISION</title>
<script>
(function(){
  var k='azav_theme',s=localStorage.getItem(k);
  if(s!=='light'&&s!=='dark')s=window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';
  document.documentElement.setAttribute('data-theme',s);
  var m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute('content',s==='light'?'#f8f6f2':'#0b0a09');
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root,[data-theme="dark"]{
  --gold:#c9a96e;--bg:#0b0a09;--bg-card:#161514;--border-hard:#3a3632;
  --text:#faf8f4;--text-body:#e6e2da;--muted:#d4cec4;
  color-scheme:dark;
}
[data-theme="light"]{
  --gold:#8a6b30;--bg:#f8f6f2;--bg-card:#ffffff;--border-hard:#c8c0b4;
  --text:#0c0b0a;--text-body:#2a2622;--muted:#403a34;
  color-scheme:light;
}
body{
  font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;line-height:1.5;
}
.legal-page-head{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px 20px;border-bottom:1px solid var(--border-hard);
  background:var(--bg-card);position:sticky;top:0;z-index:10;
}
.legal-back{
  color:var(--gold);text-decoration:none;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;font-weight:600;
}
.legal-back:hover{text-decoration:underline}
.legal-lang{display:flex;gap:6px}
.legal-lang-btn{
  font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  padding:6px 10px;border:1px solid var(--border-hard);border-radius:2px;
  color:var(--muted);text-decoration:none;
}
.legal-lang-btn.on,.legal-lang-btn:hover{color:var(--gold);border-color:var(--gold)}
.legal-page-main{max-width:820px;margin:0 auto;padding:28px 20px 48px}
.legal-loading{font-size:11px;color:var(--muted);padding:24px 0}
.legal-doc h1{
  font-family:'Cormorant Garamond',serif;font-size:clamp(24px,4vw,32px);
  font-weight:500;color:var(--text);margin:0 0 6px;line-height:1.2;
}
.legal-doc .legal-meta{font-size:9px;color:var(--muted);margin:0 0 22px;letter-spacing:.04em}
.legal-doc h2{
  font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gold);margin:22px 0 0;
}
.legal-doc p{font-size:11px;line-height:1.75;color:var(--text-body);margin:8px 0 0}
@media(min-width:768px){
  .legal-page-head{padding:18px 32px}
  .legal-page-main{padding:36px 32px 64px}
}
</style>
</head>
<body data-legal-page="privacy">
<header class="legal-page-head">
  <a href="index.html" class="legal-back" id="legalBack">← Voltar à loja</a>
  <nav class="legal-lang" id="legalLang" aria-label="Language"></nav>
</header>
<main class="legal-page-main" id="legalPageBody"></main>
<script id="erp-api-config">
  var ERP_API_URL_DEFAULT = 'https://script.google.com/macros/s/AKfycbzjeXiiobFsAFfMnTujXYkDZOca6dVHR3-__Vv2POTZWHcz2LONQRcpwTBZle-rh1XBbg/exec';
  var API_URL = ERP_API_URL_DEFAULT;
</script>
<script src="legal/meta.js"></script>
<script src="legal/helpers.js"></script>
<script src="legal/privacy.js"></script>
<script src="legal/terms.js"></script>
<script src="legal/notice.js"></script>
<script src="legal/index.js"></script>
<script src="legal-page.js"></script>
</body>
</html>
