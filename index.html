<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<link rel="icon" href="favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<link rel="manifest" href="site.webmanifest"/>
<meta name="theme-color" content="#0b0a09" id="metaThemeColor"/>
<meta property="og:image" content="icons/icon-512.png"/>
<title>AZAVISION — Boutique en ligne</title>
<script>
(function(){
  var k='azav_theme',s=localStorage.getItem(k);
  if(s!=='light'&&s!=='dark')s=window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';
  document.documentElement.setAttribute('data-theme',s);
  var m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute('content',s==='light'?'#f8f6f2':'#0b0a09');
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* ── RESET & VARS ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root,[data-theme="dark"]{
  --gold:#bda061;--gold-lt:#ebd091;--gold-dk:#a08040;
  --bg:#0b0a09;--bg-card:#141312;--bg-modal:#0f0e0d;
  --border:rgba(201,168,76,.14);--border-hard:#222;
  --text:#f4f2ee;--muted:#888;--muted2:#555;
  --nav-bg:rgba(11,10,9,.93);
  --overlay:rgba(0,0,0,.65);--overlay-modal:rgba(0,0,0,.88);
  --overlay-search:rgba(0,0,0,.97);
  --divider:rgba(255,255,255,.05);--divider-soft:rgba(255,255,255,.07);
  --icon-hover:rgba(255,255,255,.06);
  --lang-border:rgba(255,255,255,.12);--lang-inactive:#555;
  --card-img-bg:#1a1918;--card-shade:rgba(0,0,0,.3);
  --card-hover-shadow:0 20px 60px rgba(0,0,0,.55);
  --qv-btn-bg:#fff;--qv-btn-text:#000;--qv-btn-hover:#eee;
  --qty-border:#3a3a3a;--qty-hover:#1e1e1e;
  --progress-bg:#1e1e1e;--drawer-foot:rgba(0,0,0,.2);
  --surface-elevated:#1e1e1e;--surface-muted:#2a2a2a;
  --footer-bg:#090807;--soc-border:#222;--soc-color:#666;
  --placeholder:#333;--hint:#444;
  --search-close:rgba(0,0,0,.5);
  --fab-fg:#0b0a09;--fab-shadow:0 6px 24px rgba(0,0,0,.45);
  --api-banner-bg:#2a1a0a;--api-banner-text:var(--gold-lt);
  --toast-bg:var(--bg-card);--toast-shadow:0 10px 40px rgba(0,0,0,.6);
  --tr-line:#1e1e1e;--tr-dot:#2a2a2a;
  --section-border:rgba(255,255,255,.05);
  --on-gold:#000;
  color-scheme:dark;
}
[data-theme="light"]{
  --gold:#9a7b3c;--gold-lt:#c4a24e;--gold-dk:#7a6230;
  --bg:#f8f6f2;--bg-card:#ffffff;--bg-modal:#ffffff;
  --border:rgba(154,123,60,.22);--border-hard:#e0dbd2;
  --text:#1c1916;--muted:#6b6560;--muted2:#9a928a;
  --nav-bg:rgba(248,246,242,.94);
  --overlay:rgba(28,25,22,.4);--overlay-modal:rgba(28,25,22,.55);
  --overlay-search:rgba(248,246,242,.98);
  --divider:rgba(28,25,22,.08);--divider-soft:rgba(28,25,22,.1);
  --icon-hover:rgba(28,25,22,.06);
  --lang-border:rgba(28,25,22,.12);--lang-inactive:#9a928a;
  --card-img-bg:#ece8e0;--card-shade:rgba(255,255,255,.15);
  --card-hover-shadow:0 16px 48px rgba(28,25,22,.12);
  --qv-btn-bg:#1c1916;--qv-btn-text:#fff;--qv-btn-hover:#333;
  --qty-border:#d8d2c8;--qty-hover:#ece8e0;
  --progress-bg:#e8e4dc;--drawer-foot:rgba(28,25,22,.04);
  --surface-elevated:#f0ebe3;--surface-muted:#e8e4dc;
  --footer-bg:#f0ebe3;--soc-border:#d8d2c8;--soc-color:#8a8278;
  --placeholder:#b5aea4;--hint:#8a8278;
  --search-close:rgba(248,246,242,.6);
  --fab-fg:#1c1916;--fab-shadow:0 6px 24px rgba(28,25,22,.18);
  --api-banner-bg:#faf3e4;--api-banner-text:#6b4f1a;
  --toast-bg:#fff;--toast-shadow:0 10px 40px rgba(28,25,22,.15);
  --tr-line:#e0dbd2;--tr-dot:#d8d2c8;
  --section-border:rgba(28,25,22,.08);
  --on-gold:#1c1916;
  color-scheme:light;
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;min-height:100dvh;overflow-x:hidden;
  transition:background .25s,color .25s;
  padding-bottom:env(safe-area-inset-bottom,0);
}
body.scroll-lock{overflow:hidden;touch-action:none;position:fixed;width:100%;left:0;right:0}

/* â”€â”€ SCROLLBAR â”€â”€ */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--gold-dk);border-radius:2px}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   PROMO MARQUEE
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
.promo-bar{
  background:var(--gold);color:var(--on-gold);
  font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
  padding:10px 0;overflow:hidden;border-bottom:1px solid var(--gold-dk);
  cursor:default;user-select:none;
}
.marquee-wrap{display:flex;width:max-content;animation:marquee 30s linear infinite}
.marquee-wrap:hover{animation-play-state:paused}
.marquee-wrap span{padding:0 40px;white-space:nowrap}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   NAVBAR
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
nav{
  position:sticky;top:0;z-index:100;
  background:var(--nav-bg);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);height:76px;
  transition:background .25s;
  display:flex;align-items:center;
}
.nav-inner{
  max-width:1320px;margin:0 auto;padding:0 40px;
  width:100%;display:flex;align-items:center;justify-content:space-between;
}
.brand{
  font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:300;
  letter-spacing:6px;text-transform:uppercase;
  background:none;border:none;color:var(--text);cursor:pointer;
  display:flex;align-items:baseline;gap:1px;
}
.brand-dot{color:var(--gold);font-weight:600}
.brand img.brand-logo{height:38px;width:auto;object-fit:contain;display:block}
.brand.brand-with-logo{padding:0;background:none;border:none;cursor:pointer;display:flex;align-items:center}
.nav-ul{display:flex;gap:28px;list-style:none}
.nav-ul button{
  background:none;border:none;color:var(--muted);
  font-family:'Montserrat',sans-serif;font-size:10px;font-weight:500;
  letter-spacing:2px;text-transform:uppercase;cursor:pointer;
  padding:6px 0;transition:color .2s;position:relative;
}
.nav-ul button::after{
  content:'';position:absolute;bottom:-2px;left:0;width:0;height:1px;
  background:var(--gold);transition:width .25s;
}
.nav-ul button:hover{color:var(--text)}
.nav-ul button:hover::after,.nav-ul button.active::after{width:100%}
.nav-ul button.active{color:var(--gold)}
.nav-right{display:flex;align-items:center;gap:6px}
.lang-box,.theme-box{
  display:flex;align-items:center;gap:2px;
  border:1px solid var(--lang-border);border-radius:3px;padding:3px 5px;
}
.lang-box button,.theme-box button{
  background:none;border:none;font-size:10px;font-weight:700;
  cursor:pointer;color:var(--lang-inactive);padding:2px 7px;border-radius:2px;transition:all .15s;
  display:flex;align-items:center;justify-content:center;
}
.lang-box button.on,.theme-box button.on{background:var(--gold);color:var(--on-gold)}
.theme-box button svg{width:14px;height:14px}
.icon-btn{
  background:none;border:none;color:var(--text);cursor:pointer;
  padding:9px;border-radius:50%;transition:background .2s,color .2s;
  position:relative;display:flex;align-items:center;justify-content:center;
}
.icon-btn:hover{background:var(--icon-hover)}
[data-theme="dark"] .ico-theme-light{display:none}
[data-theme="light"] .ico-theme-dark{display:none}
.icon-btn svg{width:19px;height:19px;stroke-width:1.5}
.nav-menu-btn{
  display:none;background:none;border:none;color:var(--text);cursor:pointer;
  padding:10px;margin-right:2px;border-radius:4px;
  min-width:44px;min-height:44px;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
.nav-menu-btn svg{width:22px;height:22px;stroke-width:1.5}
.nav-mobile-bg{
  position:fixed;inset:0;z-index:150;background:var(--overlay);
  backdrop-filter:blur(6px);display:none;
}
.nav-mobile-bg.open{display:block}
.nav-mobile-bg .click-close{position:absolute;inset:0}
.nav-mobile-drawer{
  position:absolute;top:0;left:0;bottom:0;width:min(300px,88vw);
  background:var(--bg-modal);border-right:1px solid var(--border-hard);
  display:flex;flex-direction:column;
  transform:translateX(-100%);transition:transform .32s cubic-bezier(.4,0,.2,1);
  padding-top:env(safe-area-inset-top,0);
  padding-bottom:env(safe-area-inset-bottom,0);
}
.nav-mobile-bg.open .nav-mobile-drawer{transform:translateX(0)}
.nav-mobile-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px;border-bottom:1px solid var(--divider);flex-shrink:0;
}
.nav-mobile-head span{
  font-family:'Cormorant Garamond',serif;font-size:18px;letter-spacing:4px;text-transform:uppercase;
}
.nav-mobile-ul{list-style:none;padding:12px 10px;overflow-y:auto;flex:1}
.nav-mobile-ul button{
  display:block;width:100%;text-align:left;background:none;border:none;
  color:var(--muted);font-family:'Montserrat',sans-serif;
  font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase;
  padding:14px 12px;min-height:48px;cursor:pointer;border-radius:3px;
  transition:color .2s,background .2s;-webkit-tap-highlight-color:transparent;
}
.nav-mobile-ul button:hover,.nav-mobile-ul button.active{color:var(--gold);background:var(--icon-hover)}
.nav-mobile-foot{
  padding:12px 14px 16px;border-top:1px solid var(--divider);flex-shrink:0;
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;
}
.mob-bar{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:120;
  background:var(--nav-bg);backdrop-filter:blur(16px);
  border-top:1px solid var(--border);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0));
  justify-content:space-around;align-items:stretch;
}
.mob-bar button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:none;color:var(--muted);cursor:pointer;
  font-family:'Montserrat',sans-serif;font-size:8px;letter-spacing:1px;text-transform:uppercase;
  padding:8px 4px;min-height:48px;position:relative;
  -webkit-tap-highlight-color:transparent;
}
.mob-bar button svg{width:20px;height:20px;stroke-width:1.5}
.mob-bar button.on,.mob-bar button:active{color:var(--gold)}
.mob-bar .mob-pill{
  position:absolute;top:4px;right:calc(50% - 22px);
  background:var(--gold);color:var(--on-gold);
  font-size:7px;font-weight:800;min-width:15px;height:15px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
}
.pill{
  position:absolute;top:-1px;right:-1px;
  background:var(--gold);color:#000;
  font-size:8px;font-weight:800;
  width:15px;height:15px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.pill.red{background:#ef4444;color:#fff;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   HERO
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
.hero{
  position:relative;height:88vh;min-height:560px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.hero-bg{
  position:absolute;inset:0;
  background:url('https://picsum.photos/seed/hero1/1600/900') center/cover no-repeat;
  transform:scale(1.06);transition:transform 9s ease;
}
.hero:hover .hero-bg{transform:scale(1)}
.hero-grad{
  position:absolute;inset:0;
  background:linear-gradient(105deg,rgba(0,0,0,.84) 0%,rgba(0,0,0,.38) 50%,rgba(0,0,0,.78) 100%);
}
.hero-content{
  position:relative;z-index:2;text-align:center;color:#fff;
  max-width:900px;padding:0 28px;
  display:flex;flex-direction:column;align-items:center;
}
.hero-eyebrow{
  font-size:10px;font-weight:600;letter-spacing:7px;text-transform:uppercase;
  color:var(--gold);margin-bottom:18px;
  animation:fadeUp .8s .1s both;
}
.hero-h1{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(44px,7.5vw,100px);font-weight:200;
  line-height:1.07;text-transform:uppercase;letter-spacing:2px;
  margin-bottom:22px;animation:fadeUp .8s .2s both;
}
.hero-h1 em{font-style:italic;color:var(--gold);font-weight:300}
.hero-p{
  font-size:12px;color:rgba(255,255,255,.72);font-weight:300;
  line-height:1.9;max-width:500px;margin-bottom:40px;
  animation:fadeUp .8s .3s both;
}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;animation:fadeUp .8s .4s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.btn-gold{
  background:var(--gold);color:#000;border:none;
  padding:15px 32px;font-size:10px;font-weight:800;letter-spacing:3px;
  text-transform:uppercase;cursor:pointer;border-radius:2px;
  transition:background .2s;display:flex;align-items:center;gap:8px;
}
.btn-gold:hover{background:var(--gold-lt)}
.btn-ghost{
  background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6);
  padding:15px 32px;font-size:10px;font-weight:500;letter-spacing:3px;
  text-transform:uppercase;cursor:pointer;border-radius:2px;transition:all .2s;
}
.btn-ghost:hover{background:#fff;color:#000;border-color:#fff}
.scroll-cue{
  position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  color:rgba(255,255,255,.35);font-size:8px;letter-spacing:3px;text-transform:uppercase;
}
.scroll-arr{animation:bob .8s 1s infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(5px)}}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   SERVICES STRIP
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
.services{
  border-top:1px solid var(--section-border);
  border-bottom:1px solid var(--section-border);
  padding:44px 40px;
}
.services-grid{
  max-width:1320px;margin:0 auto;
  display:grid;grid-template-columns:repeat(4,1fr);gap:20px;
}
.svc{display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px}
.svc-icon{font-size:26px;margin-bottom:10px}
.svc-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:5px}
.svc-desc{font-size:10px;color:var(--muted);font-weight:300;line-height:1.7}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   SHOP MAIN
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
#shop{max-width:1320px;margin:0 auto;padding:64px 40px}

.shop-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px}
.sh-left .sh-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}
.sh-left .sh-title{
  font-family:'Cormorant Garamond',serif;
  font-size:30px;font-weight:300;letter-spacing:2px;margin-top:4px;
}
.btn-see-all{
  background:none;border:none;color:var(--gold);
  font-size:9px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;
  border-bottom:1px solid var(--gold);padding-bottom:2px;transition:opacity .2s;
}
.btn-see-all:hover{opacity:.7}

/* Category pills */
.cat-row{
  display:flex;gap:7px;overflow-x:auto;padding-bottom:14px;
  margin-bottom:28px;scrollbar-width:none;
}
.cat-row::-webkit-scrollbar{display:none}
.cat-pill{
  flex-shrink:0;padding:9px 18px;border:1px solid rgba(201,168,76,.18);
  background:none;color:var(--muted);font-size:9px;letter-spacing:2px;
  text-transform:uppercase;font-weight:500;cursor:pointer;border-radius:2px;
  transition:all .2s;white-space:nowrap;
}
.cat-pill:hover{border-color:var(--gold);color:var(--text)}
.cat-pill.on{background:var(--gold);color:#000;border-color:var(--gold)}

/* Sort / search bar */
.sort-row{
  display:flex;justify-content:space-between;align-items:center;
  padding-bottom:22px;border-bottom:1px solid var(--divider);
  margin-bottom:28px;flex-wrap:wrap;gap:12px;
}
.result-n{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted2)}
.sort-tools{display:flex;gap:10px;align-items:center}
.search-wrap{position:relative}
.search-wrap input{
  background:var(--bg-card);border:1px solid var(--border-hard);color:var(--text);
  font-family:'Montserrat',sans-serif;font-size:10px;
  padding:8px 34px 8px 12px;border-radius:2px;width:190px;outline:none;
  transition:border .2s;
}
.search-wrap input:focus{border-color:var(--gold)}
.search-wrap svg{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:13px;height:13px;color:var(--muted);pointer-events:none;stroke-width:1.5;
}
.sort-sel{
  background:var(--bg-card);border:1px solid var(--border-hard);color:var(--muted);
  font-family:'Montserrat',sans-serif;font-size:10px;
  padding:8px 12px;border-radius:2px;cursor:pointer;outline:none;
}

   PRODUCT GRID
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 18px}

.card{display:flex;flex-direction:column;cursor:pointer;border-radius:2px;overflow:hidden}
.card:hover{box-shadow:var(--card-hover-shadow)}

.card-img{
  position:relative;aspect-ratio:3/4;overflow:hidden;
  background:var(--card-img-bg);border-radius:2px;margin-bottom:12px;
}
.card-img img{
  width:100%;height:100%;object-fit:cover;object-position:top;
  transition:transform .7s ease;display:block;
}
.card:hover .card-img img{transform:scale(1.07)}

/* Overlay */
.card-overlay{
  position:absolute;inset:0;
  background:var(--card-shade);
  opacity:0;transition:opacity .3s;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:20px;
}
.card:hover .card-overlay{opacity:1}
.ov-btns{display:flex;gap:7px;width:88%;animation:fadeUp .3s both}
.btn-qv{

}
.btn-qv:hover{background:var(--qv-btn-hover)}
.btn-add-ov{
  background:var(--gold);color:#000;border:none;
  padding:11px 13px;border-radius:2px;cursor:pointer;
  transition:background .2s;display:flex;align-items:center;
}
.btn-add-ov:hover{background:var(--gold-lt)}
.btn-add-ov svg{width:13px;height:13px;stroke-width:2}

/* Badge */
.badge{
  position:absolute;top:12px;left:12px;
  font-size:8px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  padding:4px 9px;border-radius:1px;
}
.badge-n{background:var(--gold);color:#000}
.badge-s{background:#dc2626;color:#fff}

/* Fav btn */
.btn-fav{
  position:absolute;top:12px;right:12px;
  width:32px;height:32px;border-radius:50%;
  background:rgba(0,0,0,.45);backdrop-filter:blur(6px);
  border:none;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s;
}
.btn-fav:hover{transform:scale(1.15)}
.btn-fav svg{width:16px;height:16px;stroke-width:1.5}
.btn-fav.faved svg{fill:#ef4444;color:#ef4444}

/* Info */
.card-info{padding:0 2px}
.card-name{
  font-family:'Cormorant Garamond',serif;
  font-size:14px;font-weight:300;letter-spacing:1px;
  margin-bottom:4px;line-height:1.3;
}
.card-stars{font-size:10px;color:#f59e0b;margin-bottom:7px}
.card-stars span{color:var(--muted);font-size:9px}
.card-price{display:flex;align-items:baseline;gap:7px;margin-bottom:7px}
.price-c{font-size:13px;font-weight:600;color:var(--gold)}
.price-o{font-size:10px;color:var(--muted);text-decoration:line-through}
.swatches{display:flex;gap:4px}
.sw{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.14)}

/* No results */
.no-res{
  grid-column:1/-1;text-align:center;padding:80px 0;
}
.no-res h3{
  font-family:'Cormorant Garamond',serif;
  font-size:24px;font-weight:300;margin-bottom:10px;
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   DRAWERS
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */

/* Empty state */

/* Shipping progress */
.ship-bar{margin-bottom:14px}

/* Promo */

.toast{

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•

footer{

<script>
// UI SHELL (traductions i18n.js + catalogue erp-shop.js)
let lang = 'fr';
const $ = id => document.getElementById(id);

function updateLangButtons(l) {
  ['fr', 'pt', 'en', 'es'].forEach(function (code) {
    var btn = $('btn' + code.charAt(0).toUpperCase() + code.slice(1));
    if (btn) btn.classList.toggle('on', l === code);
  });
}

function getTheme() {
  return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
}

function updateThemeButtons() {
  var th = getTheme();
  if ($('btnThemeDark')) $('btnThemeDark').classList.toggle('on', th === 'dark');
  if ($('btnThemeLight')) $('btnThemeLight').classList.toggle('on', th === 'light');
  var tr = (typeof T !== 'undefined' && T[lang]) ? T[lang] : null;
  if (tr && $('btnThemeDark')) $('btnThemeDark').title = tr.themeDark || 'Dark';
  if (tr && $('btnThemeLight')) $('btnThemeLight').title = tr.themeLight || 'Light';
}

function setTheme(theme) {
  theme = theme === 'light' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('azav_theme', theme); } catch (e) { /* ignore */ }
  var meta = $('metaThemeColor') || document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'light' ? '#f8f6f2' : '#0b0a09');
  updateThemeButtons();
  if (window.Shop && window.Shop.onThemeChange) window.Shop.onThemeChange(theme);
}

function toggleTheme() {
  setTheme(getTheme() === 'dark' ? 'light' : 'dark');
}
window.setTheme = setTheme;
window.toggleTheme = toggleTheme;
window.getTheme = getTheme;

function applyShopLang(l) {
  if (window._langSet || !T[l]) return;
  lang = l;
  updateLangButtons(l);
  boot();
}
window.applyShopLang = applyShopLang;

function setLang(l) {
  if (!T[l]) l = 'fr';
  lang = l;
  window._langSet = true;
  document.documentElement.lang = (window.htmlLangMap && window.htmlLangMap[l]) || l;
  if (window.Shop) window.Shop.setLang(l);
  updateLangButtons(l);
  boot();
}

function boot() {
  const t = T[lang] || T.fr;
  document.documentElement.lang = (window.htmlLangMap && window.htmlLangMap[lang]) || lang;
  if ($('apiBanner') && t.apiBanner) $('apiBanner').innerHTML = t.apiBanner;
  if ($('shopLoader')) $('shopLoader').textContent = t.shopLoader;
  if ($('btnAccount')) $('btnAccount').title = t.navAccount;
  if ($('btnSearch')) $('btnSearch').title = t.navSearch;
  if ($('btnWish')) $('btnWish').title = t.navWish;
  if ($('btnCart')) $('btnCart').title = t.navCart;
  if ($('contactFab') && t.contact) $('contactFab').title = t.contact.navContact;
  updateThemeButtons();
  if ($('nwEmail') && t.fNwPH) $('nwEmail').placeholder = t.fNwPH;
  ['mq1', 'mq2', 'mq3', 'mq4'].forEach(id => { if ($(id)) $(id).textContent = t.promo; });
  if (window.Shop && window.Shop.renderNav) {
    window.Shop.renderNav();
  } else if ($('navUl')) {
    $('navUl').innerHTML = t.nav.map(l =>
      `<li><button type="button" onclick="Shop.scrollShop()">${l}</button></li>`
    ).join('');
  }
  if ($('hEye')) $('hEye').textContent = t.hEye;
  if ($('hTitle')) $('hTitle').innerHTML = t.hTitle;
  if ($('hSub')) $('hSub').textContent = t.hSub;
  if ($('hBtn1')) $('hBtn1').textContent = t.hBtn1;
  if ($('hBtn2')) $('hBtn2').textContent = t.hBtn2;
  if ($('scrollHint')) $('scrollHint').textContent = t.scrollHint;
  if ($('svcGrid')) {
    $('svcGrid').innerHTML = t.svc.map(s =>
      `<div class="svc"><span class="svc-icon">${s.i}</span><h3 class="svc-title">${s.t}</h3><p class="svc-desc">${s.d}</p></div>`
    ).join('');
  }
  if ($('secLabel')) $('secLabel').textContent = t.secLabel;
  if ($('secTitle')) $('secTitle').textContent = t.secTitle;
  if ($('seeAll')) $('seeAll').textContent = t.seeAll;
  if ($('srchIn')) $('srchIn').placeholder = t.srchPH;
  ['sd', 'sa', 'sds', 'sr'].forEach((id, i) => {
    const el = $(id);
    if (el) el.textContent = [t.sd, t.sa, t.sds, t.sr][i];
  });
  if ($('fDesc') && !$('fDesc').dataset.erp) $('fDesc').textContent = t.fDesc;
  if ($('fShopT')) $('fShopT').textContent = t.fShopT;
  if ($('fSuppT')) $('fSuppT').textContent = t.fSuppT;
  if ($('fNwT')) $('fNwT').textContent = t.fNwT;
  if ($('fNwD')) $('fNwD').textContent = t.fNwD;
  if ($('fNwBtn')) $('fNwBtn').textContent = t.fNwBtn;
  if ($('fCopy')) $('fCopy').textContent = t.fCopy;
  if ($('fShopL') && window.Shop && window.Shop.renderFooterShop) {
    window.Shop.renderFooterShop();
  }
  if ($('fSuppL')) {
    $('fSuppL').innerHTML = t.fSupp.map((l, i) => {
      const click = i === 0 ? 'Shop.openOrdersOrLogin()' : 'Shop.openContact()';
      return `<li><a href="#" onclick="event.preventDefault();${click}">${l}</a></li>`;
    }).join('');
  }
  if ($('fLegal')) $('fLegal').innerHTML = t.fLegal.map(l => `<a href="#">${l}</a>`).join('');
  if ($('soLbl')) $('soLbl').textContent = t.soLbl;
  if ($('soIn')) $('soIn').placeholder = t.soPH;
  if ($('soHint')) $('soHint').textContent = t.soHint;
  if ($('cartDTitle')) $('cartDTitle').innerHTML = `${t.cartT} <span class="dh-n" id="cDN">0</span>`;
  if ($('wishDTitle')) $('wishDTitle').innerHTML = `${t.wishT} <span class="dh-n" id="wDN">0</span>`;
  if (window.Shop) {
    window.Shop.renderCats && window.Shop.renderCats();
    window.Shop.render && window.Shop.render();
  }
}

function scrollShop() {
  if (window.Shop && window.Shop.scrollShop) window.Shop.scrollShop();
  else if ($('shop')) $('shop').scrollIntoView({ behavior: 'smooth' });
}

function openSearch() {
  $('soEl').classList.add('open');
  $('soIn').focus();
  if (window.Shop && window.Shop.updateScrollLock) window.Shop.updateScrollLock();
  else document.body.classList.add('scroll-lock');
}
function closeSo() {
  $('soEl').classList.remove('open');
  if (window.Shop && window.Shop.updateScrollLock) window.Shop.updateScrollLock();
  else document.body.classList.remove('scroll-lock');
}
function soKey(e) { if (e.key === 'Enter' || e.key === 'Escape') closeSo(); }
function syncSo() { $('srchIn').value = $('soIn').value; if (window.Shop) Shop.refreshProducts(); }

let _tt;
function toast(msg, type = 's') {
  const el = $('toastEl');
  el.textContent = msg;
  el.className = `toast ${type}`;
  clearTimeout(_tt);
  _tt = setTimeout(() => el.classList.add('hide'), 3000);
}

updateThemeButtons();
boot();
</script>
