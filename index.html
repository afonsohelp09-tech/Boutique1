Ã¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢Â */
.promo-bar{

  background:var(--gold);color:var(--on-gold);

  cursor:default;user-select:none;
}
.marquee-wrap{display:flex;width:max-content;animation:marquee 30s linear infinite}
.marquee-wrap:hover{animation-play-state:paused}
.marquee-wrap span{padding:0 40px;white-space:nowrap}

body.vitrine-pending .promo-bar,
body.vitrine-pending .services-in-footer,
body.vitrine-pending .services{display:none!important}
/* Hero : chargement (A = marque, B = discret) avant config admin */
.hero-loading{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(12px,3vw,20px);min-height:min(52vh,420px);padding:24px 16px;
  animation:fadeUp .7s both;
}
.hero-loading-logo{
  width:clamp(72px,18vw,120px);height:auto;object-fit:contain;

}

}

body:not(.vitrine-pending) .hero-loading{display:none!important}

  visibility:visible;opacity:1;pointer-events:auto;
  position:static;width:auto;height:auto;overflow:visible;clip:auto;

/* Ã¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢Â
   NAVBAR
Ã¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢Â */
nav{
  position:sticky;top:0;z-index:100;
  background:var(--nav-bg);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);min-height:76px;height:auto;
  transition:background .25s;
  display:flex;align-items:center;
}
.nav-inner{
  max-width:1320px;margin:0 auto;padding:0 clamp(16px,3vw,40px);
  width:100%;
  display:grid;
  grid-template-columns:minmax(0,auto) minmax(0,1fr) minmax(0,auto);
  align-items:center;
  gap:clamp(12px,2vw,24px);
}
.nav-left{
  display:flex;align-items:center;gap:4px;
  min-width:0;flex-shrink:0;max-width:min(240px,34vw);
  position:relative;z-index:2;
}
.brand{
  font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:300;
  letter-spacing:6px;text-transform:uppercase;
  background:none;border:none;color:var(--text);cursor:pointer;
  display:flex;align-items:baseline;gap:1px;
}
.brand-dot{color:var(--gold);font-weight:600}
.brand img.brand-logo,.f-brand img.f-logo{
  object-fit:contain;
  filter:var(--logo-filter);
}
.brand img.brand-logo{
  height:48px;max-height:52px;width:auto;max-width:min(240px,44vw);
  display:block;flex-shrink:0;
}
.brand.brand-with-logo{
  padding:2px 8px 2px 0;background:none;border:none;cursor:pointer;
  display:flex;align-items:center;min-height:48px;max-width:100%;overflow:hidden;
}
.nav-ul{
  display:flex;gap:clamp(10px,1.6vw,28px);list-style:none;margin:0;padding:0;
  justify-content:center;align-items:center;flex-wrap:wrap;
  min-width:0;overflow:hidden;
}
.nav-ul button{
  background:none;border:none;color:var(--muted);
  font-family:'Montserrat',sans-serif;font-size:10px;font-weight:500;
  letter-spacing:2px;text-transform:uppercase;cursor:pointer;
  padding:6px 0;transition:color .2s;position:relative;
}
.nav-ul button::after{
  content:'';position:absolute;bottom:-2px;left:0;width:0;height:1px;
  background:var(--gold);transition:width .25s;
}
.nav-ul button:hover{color:var(--text)}
.nav-ul button:hover::after,.nav-ul button.active::after{width:100%}
.nav-ul button.active{color:var(--gold)}
.nav-info-sep{
  width:1px;height:18px;background:var(--border-hard);align-self:center;
  margin:0 4px 0 8px;list-style:none;
}
.nav-info-btn{
  background:none;border:none;color:var(--gold);
  font-family:'Montserrat',sans-serif;font-size:10px;font-weight:600;
  letter-spacing:2px;text-transform:uppercase;cursor:pointer;
  padding:6px 0;transition:color .2s,opacity .2s;position:relative;
}
.nav-info-btn::after{
  content:'';position:absolute;bottom:-2px;left:0;width:0;height:1px;
  background:var(--gold);transition:width .25s;
}
.nav-info-btn:hover{opacity:.85}
.nav-info-btn:hover::after{width:100%}
.nav-right{display:flex;align-items:center;gap:6px;flex-shrink:0;justify-self:end}
.lang-switch,.theme-switch{
  display:inline-flex;align-items:stretch;gap:2px;
  background:var(--seg-bg);border:1px solid var(--seg-border);
  border-radius:999px;padding:3px;
}
.lang-switch button,.theme-switch button{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  background:transparent;border:none;font-size:9px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;
  cursor:pointer;color:var(--seg-muted);
  padding:6px 10px;border-radius:999px;min-height:32px;
  transition:background .2s,color .2s,box-shadow .2s;
  -webkit-tap-highlight-color:transparent;
}
.lang-switch button{min-width:34px;padding:6px 8px}
.theme-switch button svg{width:15px;height:15px;flex-shrink:0;stroke-width:1.75}
.theme-switch .theme-lbl{display:none}
@media(min-width:1100px){.theme-switch .theme-lbl{display:inline}}
.lang-switch button.on,.theme-switch button.on{
  background:var(--gold);color:var(--on-gold);
  box-shadow:0 1px 6px rgba(0,0,0,.18);
}
.lang-switch button:not(.on):hover,.theme-switch button:not(.on):hover{
  color:var(--text);background:var(--seg-hover);
}
.lang-box{display:inline-flex}
/* Controles compacts mobile (langue + theme) - Option B */
.lang-mini,.theme-mini{display:inline-flex}
.nav-right>.lang-box,.nav-right>.theme-switch{display:none}
.lang-mini{position:relative}
.lang-mini-btn{
  display:inline-flex;align-items:center;gap:3px;
  background:var(--seg-bg);border:1px solid var(--seg-border);color:var(--text);
  font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;
  padding:7px 9px;border-radius:999px;min-height:38px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.lang-mini-btn .lm-chev{width:12px;height:12px;flex-shrink:0;stroke-width:2;transition:transform .2s}
.lang-mini.open .lang-mini-btn .lm-chev{transform:rotate(180deg)}
.lang-mini-menu{
  display:none;position:absolute;top:calc(100% + 6px);right:0;z-index:130;
  background:var(--bg-modal);border:1px solid var(--border-hard);
  border-radius:10px;padding:5px;min-width:64px;box-shadow:0 12px 32px rgba(0,0,0,.28);
}
.lang-mini.open .lang-mini-menu{display:block}
.lang-mini-menu button{
  display:block;width:100%;text-align:center;background:none;border:none;
  color:var(--text-body);font-family:'Montserrat',sans-serif;font-size:10px;
  font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:9px 12px;min-height:40px;border-radius:7px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.lang-mini-menu button:hover{background:var(--seg-hover);color:var(--text)}
.lang-mini-menu button.on{background:var(--gold);color:var(--on-gold)}
.theme-mini{
  align-items:center;justify-content:center;flex-shrink:0;
  background:var(--seg-bg);border:1px solid var(--seg-border);color:var(--text);
  padding:0;width:38px;height:38px;border-radius:50%;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.theme-mini svg{width:17px;height:17px;stroke-width:1.75}
.theme-mini .ti-moon{display:none}
.theme-mini .ti-sun{display:block}
[data-theme="light"] .theme-mini .ti-sun{display:none}
[data-theme="light"] .theme-mini .ti-moon{display:block}
/* Mode foncé : contrôles compacts en-tête (langue PT▾ + lune/soleil) plus visibles */
[data-theme="dark"] .lang-mini-btn,
[data-theme="dark"] .theme-mini{
  background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4);color:var(--text);
}
[data-theme="dark"] .lang-mini-btn:hover,
[data-theme="dark"] .theme-mini:hover{
  background:rgba(255,255,255,.2);border-color:var(--gold);
}
.icon-btn{
  background:none;border:none;color:var(--text);cursor:pointer;
  padding:9px;border-radius:50%;transition:background .2s,color .2s;
  position:relative;display:flex;align-items:center;justify-content:center;
}
.icon-btn:hover{background:var(--icon-hover)}
.icon-btn svg{width:19px;height:19px;stroke-width:1.5}
.icon-btn,.nav-menu-btn,.mob-bar button svg{color:inherit}
.nav-menu-btn{
  display:none;background:none;border:none;color:var(--text);cursor:pointer;
  padding:10px;margin-right:2px;border-radius:4px;
  min-width:44px;min-height:44px;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
.nav-menu-btn svg{width:22px;height:22px;stroke-width:1.5}
.nav-mobile-bg{
  position:fixed;inset:0;z-index:150;background:var(--overlay);
  backdrop-filter:blur(6px);display:none;
}
.nav-mobile-bg.open{display:block}
.nav-mobile-bg .click-close{position:absolute;inset:0}
.nav-mobile-drawer{
  position:absolute;top:0;left:0;bottom:0;width:min(300px,88vw);
  background:var(--bg-modal);border-right:1px solid var(--border-hard);
  display:flex;flex-direction:column;
  transform:translateX(-100%);transition:transform .32s cubic-bezier(.4,0,.2,1);
  padding-top:env(safe-area-inset-top,0);
  padding-bottom:env(safe-area-inset-bottom,0);
}
.nav-mobile-bg.open .nav-mobile-drawer{transform:translateX(0)}
.nav-mobile-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px;border-bottom:1px solid var(--divider);flex-shrink:0;
}
.nav-mobile-head span{
  font-family:'Cormorant Garamond',serif;font-size:18px;letter-spacing:4px;text-transform:uppercase;
}
.nav-mobile-ul{list-style:none;padding:12px 10px;overflow-y:auto;flex:1;order:2}
.nav-mobile-ul button{
  display:block;width:100%;text-align:left;background:none;border:none;
  color:var(--muted);font-family:'Montserrat',sans-serif;
  font-size:12px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;line-height:1.3;
  padding:14px 12px;min-height:48px;cursor:pointer;border-radius:3px;
  transition:color .2s,background .2s;-webkit-tap-highlight-color:transparent;
}
.nav-mobile-ul button:hover,.nav-mobile-ul button.active{color:var(--gold);background:var(--icon-hover)}
.nav-mobile-ul a.nav-info-link{
  display:block;width:100%;text-align:left;background:none;border:none;
  color:var(--text-body);font-family:'Montserrat',sans-serif;
  font-size:11px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;line-height:1.3;
  padding:14px 12px;min-height:48px;cursor:pointer;border-radius:3px;
  transition:color .2s,background .2s;text-decoration:none;-webkit-tap-highlight-color:transparent;
}
.nav-mobile-ul a.nav-info-link:hover{color:var(--gold);background:var(--icon-hover)}
.nav-mobile-section{
  list-style:none;padding:10px 18px 4px;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gold);font-weight:600;
}
.nav-mobile-ul .nav-info-link{color:var(--text-body);font-size:11px}
.nav-mobile-foot{
  order:1;padding:12px 14px;border-bottom:1px solid var(--divider);flex-shrink:0;
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
}
.nav-foot-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav-foot-label{
  font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted,#999);
}
.mob-bar{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:120;
  background:var(--nav-bg);backdrop-filter:blur(16px);
  border-top:1px solid var(--border);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0));
  justify-content:space-around;align-items:stretch;
}
.mob-bar button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:none;color:var(--text-body);cursor:pointer;
  font-family:'Montserrat',sans-serif;font-size:8px;letter-spacing:1px;text-transform:uppercase;
  padding:8px 4px;min-height:48px;position:relative;
  -webkit-tap-highlight-color:transparent;
}
.mob-bar button svg{width:20px;height:20px;stroke-width:1.5}
.mob-bar button.on,.mob-bar button:active{color:var(--gold)}
.mob-bar .mob-pill{
  position:absolute;top:4px;right:calc(50% - 22px);
  background:var(--gold);color:var(--on-gold);
  font-size:7px;font-weight:800;min-width:15px;height:15px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
}
.pill{
  position:absolute;top:-1px;right:-1px;
  background:var(--gold);color:#000;
  font-size:8px;font-weight:800;
  width:15px;height:15px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.pill.red{background:#ef4444;color:#fff;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* Ã¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢Â
   HERO
Ã¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢Â */
@media (prefers-reduced-motion: reduce){
  .hero-motion-canvas{display:none!important}
  .hero.hero-motion-on .hero-bg.hero-bg-hidden{opacity:.9;visibility:visible}
}
.hero{
  position:relative;height:88vh;min-height:560px;
  --hero-bg-pos:center center;
  --hero-motion-scale:1.12;
  --hero-bg-blur:10px;
  --hero-media-shift-x:10px;
  --hero-media-shift-y:-8px;
  --hero-photo-pos:center center;
  --hero-photo-scale:1.01;
  --hero-photo-opacity:.98;
  --hero-photo-width:min(96vw,1600px);
  --hero-photo-max-height:min(82vh,900px);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.hero-bg{
  position:absolute;inset:0;z-index:0;
  background-position:var(--hero-bg-pos);
  background-size:cover;
  background-repeat:no-repeat;
  filter:blur(var(--hero-bg-blur)) saturate(1.04) brightness(.78);
  opacity:.9;
  transform:scale(var(--hero-motion-scale));
  transform-origin:center center;
  transition:transform 9s ease, background-image .4s ease, background-position .4s ease;
  will-change:transform,background-position;
}
.hero:hover .hero-bg{transform:scale(1.06)}
.hero-motion-canvas{
  position:absolute;inset:0;z-index:0;width:100%;height:100%;
  display:none;pointer-events:none;opacity:.94;
}
.hero.hero-motion-on .hero-motion-canvas{display:block}
.hero.hero-motion-on .hero-bg.hero-bg-hidden{
  opacity:0;visibility:hidden;pointer-events:none;
}
.hero-media{
  position:absolute;inset:0;z-index:1;
  display:flex;align-items:center;justify-content:center;
  padding:clamp(18px,4vw,44px);
  pointer-events:none;
  animation:heroMediaDrift 16s ease-in-out infinite alternate;
  will-change:transform;
}
.hero-photo{
  width:var(--hero-photo-width);
  max-width:100%;
  max-height:var(--hero-photo-max-height);
  object-fit:contain;
  object-position:var(--hero-photo-pos);
  transform:scale(var(--hero-photo-scale));
  transition:transform 9s ease, opacity .35s ease, object-position .35s ease;
  filter:drop-shadow(0 20px 50px rgba(0,0,0,.35));
  opacity:var(--hero-photo-opacity);
}
.hero:hover .hero-photo{transform:scale(calc(var(--hero-photo-scale) - .01))}
.hero-grad{
  position:absolute;inset:0;
  z-index:2;
  background:
    linear-gradient(105deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.2) 48%,rgba(0,0,0,.78) 100%),
    linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,.08) 38%,rgba(0,0,0,.56) 100%);
}
.hero-content{
  position:relative;z-index:3;text-align:center;color:#fff;
  max-width:900px;padding:0 28px;
  display:flex;flex-direction:column;align-items:center;
}
.hero-eyebrow{
  font-size:10px;font-weight:600;letter-spacing:7px;text-transform:uppercase;
  color:var(--gold);margin-bottom:18px;
  animation:fadeUp .8s .1s both;
}
.hero-h1{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(44px,7.5vw,100px);font-weight:200;
  line-height:1.07;text-transform:uppercase;letter-spacing:2px;
  margin-bottom:22px;animation:fadeUp .8s .2s both;
}
.hero-h1 em{font-style:italic;color:var(--gold);font-weight:300}
.hero-p{
  font-size:12px;color:rgba(255,255,255,.72);font-weight:300;
  line-height:1.9;max-width:500px;margin-bottom:40px;
  animation:fadeUp .8s .3s both;
}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;animation:fadeUp .8s .4s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.btn-gold{
  background:var(--gold);color:#000;border:none;
  padding:15px 32px;font-size:10px;font-weight:800;letter-spacing:3px;
  text-transform:uppercase;cursor:pointer;border-radius:2px;
  transition:background .2s;display:flex;align-items:center;gap:8px;
}
.btn-gold:hover{background:var(--gold-lt)}
.btn-ghost{
  background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6);
  padding:15px 32px;font-size:10px;font-weight:500;letter-spacing:3px;
  text-transform:uppercase;cursor:pointer;border-radius:2px;transition:all .2s;
}
.btn-ghost:hover{background:#fff;color:#000;border-color:#fff}
.scroll-cue{
  position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  color:rgba(255,255,255,.35);font-size:8px;letter-spacing:3px;text-transform:uppercase;
}
.scroll-arr{animation:bob .8s 1s infinite alternate}
@keyframes heroMediaDrift{
  0%{transform:translate3d(calc(var(--hero-media-shift-x) * -1),calc(var(--hero-media-shift-y) * -1),0)}
  100%{transform:translate3d(var(--hero-media-shift-x),var(--hero-media-shift-y),0)}
}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(5px)}}

  display:none;position:absolute;right:28px;top:50%;transform:translateY(-50%);
  width:22px;height:22px;align-items:center;justify-content:center;

/* Ã¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢Â
   PRODUCT GRID
Ã¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢Â */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 18px}

.card{display:flex;flex-direction:column;cursor:pointer;border-radius:2px;overflow:hidden;content-visibility:auto;contain-intrinsic-size:300px 420px}
.card:hover{box-shadow:var(--card-hover-shadow)}

.card-img{
  position:relative;aspect-ratio:3/4;overflow:hidden;
  background:var(--card-img-bg);border-radius:2px;margin-bottom:12px;
}
.card-img img,
.card-img .shop-img{
  width:100%;height:100%;object-fit:cover;object-position:top;
  transition:transform .7s ease, opacity .22s ease;display:block;
}
.card-img .shop-img{opacity:0}
.card-img .shop-img.loaded,.card-img .shop-img.img-fallback{opacity:1}
.card:hover .card-img img,.card:hover .card-img .shop-img{transform:scale(1.07)}

/* Overlay */
.card-overlay{
  position:absolute;inset:0;
  background:var(--card-shade);
  opacity:0;transition:opacity .3s;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:20px;
}
.card:hover .card-overlay{opacity:1}
.ov-btns{display:flex;gap:7px;width:88%;animation:fadeUp .3s both}
.btn-qv{
  flex:1;background:var(--qv-btn-bg);color:var(--qv-btn-text);border:none;
  font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  padding:11px 6px;border-radius:2px;cursor:pointer;transition:background .2s;
}
.btn-qv:hover{background:var(--qv-btn-hover)}
.btn-add-ov{
  background:var(--gold);color:#000;border:none;
  padding:11px 13px;border-radius:2px;cursor:pointer;
  transition:background .2s;display:flex;align-items:center;
}
.btn-add-ov:hover{background:var(--gold-lt)}
.btn-add-ov svg{width:13px;height:13px;stroke-width:2}

/* Badge */
.badge{
  position:absolute;top:12px;left:12px;
  font-size:8px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  padding:4px 9px;border-radius:1px;
}
.badge-n{background:var(--gold);color:#000}
.badge-s{background:#dc2626;color:#fff}

/* Fav btn */
.btn-fav{
  position:absolute;top:12px;right:12px;
  width:32px;height:32px;border-radius:50%;
  background:rgba(0,0,0,.45);backdrop-filter:blur(6px);
  border:none;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s;
}
.btn-fav:hover{transform:scale(1.15)}
.btn-fav svg{width:16px;height:16px;stroke-width:1.5}
.btn-fav.faved svg{fill:#ef4444;color:#ef4444}

/* Info */
.card-info{padding:0 2px}
.card-name{
  font-family:'Cormorant Garamond',serif;
  font-size:14px;font-weight:300;letter-spacing:1px;
  margin-bottom:4px;line-height:1.3;color:var(--text);
}
.card-stars{font-size:10px;color:#f59e0b;margin-bottom:7px}
.card-stars span{color:var(--muted);font-size:9px}
.card-price{display:flex;align-items:baseline;gap:7px;margin-bottom:7px}
.price-c{font-size:13px;font-weight:600;color:var(--gold)}
.price-o{font-size:10px;color:var(--muted);text-decoration:line-through}
.swatches{display:flex;gap:4px}
.sw{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.14)}

/* No results */
.no-res{
  grid-column:1/-1;text-align:center;padding:80px 0;
}
.no-res h3{
  font-family:'Cormorant Garamond',serif;
  font-size:24px;font-weight:300;margin-bottom:10px;
}
.no-res p{font-size:11px;color:var(--muted);margin-bottom:20px}

/* Ã¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢Â
   DRAWERS
Ã¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢Â */
.drawer-bg{
  position:fixed;inset:0;z-index:200;
  background:var(--overlay);backdrop-filter:blur(5px);
  display:none;
}
.drawer-bg.open{display:flex;justify-content:flex-end}
.drawer-bg .click-close{position:absolute;inset:0}
.drawer{
  position:relative;z-index:1;
  width:min(440px,100vw);height:100%;
  background:var(--bg-modal);
  display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform .34s cubic-bezier(.4,0,.2,1);
  will-change:transform;
}
.drawer-bg.open .drawer{transform:translateX(0)}
.dh{
  padding:22px 24px;
  border-bottom:1px solid var(--divider);
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.dh-title{

}
.dh-n{

}

}

.db{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.df{
  padding:18px 20px;border-top:1px solid var(--divider);
  background:var(--drawer-foot);flex-shrink:0;
}

/* Empty state */
.empty{
  height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;gap:14px;
}
.empty-ico{font-size:44px}
.empty-txt{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}

/* Cart item */
.ci{
  background:var(--bg-card);border:1px solid var(--border-hard);
  border-radius:2px;padding:13px;display:flex;gap:12px;
}
.ci img,.ci .shop-img{width:68px;height:82px;object-fit:cover;object-position:top;border-radius:2px;flex-shrink:0;display:block}
.ci .shop-img{opacity:0;transition:opacity .2s ease}
.ci .shop-img.loaded,.ci .shop-img.img-fallback{opacity:1}
.ci-body{flex:1;display:flex;flex-direction:column;justify-content:space-between}

  font-family:'Cormorant Garamond',serif;

}

}
.qty button:hover{background:var(--qty-hover)}
.qty span{font-size:10px;font-weight:700;padding:4px 9px}
.ci-pr{text-align:right}
.ci-price{font-size:12px;font-weight:700;color:var(--gold)}

/* Shipping progress */
.ship-bar{margin-bottom:14px}

.ship-msg.ok{color:#22c55e}

.progress-fill{height:100%;background:linear-gradient(to right,var(--gold-lt),var(--gold));border-radius:10px;transition:width .5s}

/* Promo */
.promo-sec{margin:12px 0}
.promo-lbl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px;font-weight:600}
.promo-row{display:flex;gap:7px}
.promo-row input{
  flex:1;background:var(--bg-card);border:1px solid var(--border-hard);
  color:var(--text);font-family:'Montserrat',sans-serif;font-size:10px;
  padding:8px 11px;border-radius:2px;outline:none;text-transform:uppercase;
  transition:border .2s;
}
.promo-row input:focus{border-color:var(--gold)}
.btn-validate{
  background:var(--gold);color:#000;border:none;
  font-size:8px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  padding:0 13px;border-radius:2px;cursor:pointer;transition:background .2s;
}
.btn-validate:hover{background:var(--gold-lt)}
.promo-ok{font-size:9px;color:#22c55e;margin-top:4px}
.promo-err{font-size:9px;color:#ef4444;margin-top:4px}

/* Totals */
.totals{padding-top:12px;border-top:1px solid var(--divider);display:flex;flex-direction:column;gap:6px}
.t-row{display:flex;justify-content:space-between;font-size:10px;font-weight:300}
.t-row.disc{color:#22c55e}
.t-row.grand{font-size:15px;font-weight:700;padding-top:8px;border-top:1px solid var(--divider)}
.t-row.grand span:last-child{color:var(--gold)}
.btn-checkout{
  width:100%;background:var(--gold);color:#000;border:none;
  padding:15px;font-family:'Montserrat',sans-serif;
  font-size:9px;font-weight:800;letter-spacing:3px;text-transform:uppercase;
  cursor:pointer;border-radius:2px;transition:background .2s;margin-top:12px;
}

/* Ã¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢Â
   QUICK VIEW MODAL
Ã¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢Â */
.modal-bg{
  position:fixed;inset:0;z-index:300;

  display:none;align-items:center;justify-content:center;padding:16px;

.modal-bg .click-close{position:absolute;inset:0}
.modal{

  overflow-y:auto;display:flex;flex-wrap:wrap;
  animation:fadeUp .3s both;
}
.modal-close{
  position:absolute;top:13px;right:13px;z-index:10;
  background:rgba(0,0,0,.5);border:none;color:var(--muted);
  cursor:pointer;padding:7px;border-radius:50%;transition:color .2s;
}
.modal-close:hover{color:var(--text)}

.m-img{width:45%;min-height:420px}
.m-img img,.m-img .shop-img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.m-img .shop-img{opacity:0;transition:opacity .25s ease;min-height:280px}
.m-img .shop-img.loaded,.m-img .shop-img.img-fallback{opacity:1}
.m-img-zoom{cursor:zoom-in;position:relative;flex:1;min-height:280px;display:flex;align-items:stretch}

.m-img-zoom-badge{position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,.55);color:#fff;font-size:14px;padding:6px 10px;border-radius:20px;opacity:.85;pointer-events:none;transition:opacity .2s}

.qv-modal{flex-direction:column;flex-wrap:nowrap;max-width:920px;padding:0;overflow:hidden}
.qv-view-tabs{display:flex;border-bottom:1px solid var(--border-hard);padding:44px 0 0;background:var(--bg-panel);flex-shrink:0}

  text-transform:uppercase;cursor:pointer;border-radius:2px;min-height:48px;

.qv-mode-photo .qv-media-col{width:100%;border-right:none;flex:1;min-height:480px}

.qv-gnav{width:32px;height:32px;border:1px solid var(--border-hard);border-radius:50%;background:rgba(255,255,255,.06);color:var(--text);cursor:pointer;font-size:18px;line-height:1}

.qv-gcount{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.qv-media-col .m-img{width:100%;min-height:280px}
.img-zoom-bg{display:none;position:fixed;inset:0;z-index:10050;background:rgba(0,0,0,.94);flex-direction:column;align-items:stretch;justify-content:center;padding:56px 12px 48px}
.img-zoom-bg.open{display:flex}
.img-zoom-backdrop{position:absolute;inset:0}
.img-zoom-close{position:absolute;top:16px;right:16px;z-index:2;width:44px;height:44px;border:1px solid rgba(255,255,255,.25);border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:18px;cursor:pointer}
.img-zoom-toolbar{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:2;display:flex;gap:8px}
.img-zoom-btn{min-width:44px;height:36px;padding:0 12px;border:1px solid rgba(255,255,255,.25);border-radius:4px;background:rgba(0,0,0,.5);color:#fff;font-size:16px;cursor:pointer}
.img-zoom-wrap{position:relative;z-index:1;flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;cursor:zoom-in}
.img-zoom-wrap.dragging{cursor:grabbing}
.img-zoom-wrap img{max-width:min(96vw,1600px);max-height:min(92vh,1200px);width:auto;height:auto;object-fit:contain;transform-origin:center center;transition:transform .08s ease-out,opacity .25s ease;user-select:none;-webkit-user-drag:none;opacity:0}
.img-zoom-wrap img.loaded{opacity:1;cursor:grab}
.img-zoom-wrap.dragging img{cursor:grabbing;transition:transform .04s linear,opacity .25s ease}
.img-zoom-hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:2;font-size:11px;color:rgba(255,255,255,.65);margin:0;text-align:center;pointer-events:none}
.m-body{width:55%;padding:36px 36px 28px;display:flex;flex-direction:column}
.m-cat{font-size:8px;color:var(--gold);letter-spacing:4px;text-transform:uppercase;font-weight:600;margin-bottom:9px}
.m-name{
  font-family:'Cormorant Garamond',serif;
  font-size:26px;font-weight:300;line-height:1.2;margin-bottom:9px;
}
.m-stars{font-size:13px;color:#f59e0b;margin-bottom:14px}
.m-stars span{font-size:9px;color:var(--muted)}
.m-price{display:flex;align-items:baseline;gap:10px;margin-bottom:18px}
.m-price .c{font-size:24px;font-weight:700;color:var(--gold)}
.m-price .o{font-size:13px;color:var(--muted);text-decoration:line-through}
.tab-bar{display:flex;gap:14px;border-bottom:1px solid var(--divider-soft);margin-bottom:13px}
.tab-btn{
  background:none;border:none;color:var(--muted);
  font-family:'Montserrat',sans-serif;
  font-size:9px;letter-spacing:2px;text-transform:uppercase;
  padding-bottom:8px;cursor:pointer;transition:color .2s;
}
.tab-btn.on{color:var(--gold);border-bottom:1px solid var(--gold)}
.tab-panel{font-size:11px;color:var(--text-body);line-height:1.75;margin-bottom:18px;min-height:60px}
.tab-panel ul{padding-left:15px}
.tab-panel li{margin-bottom:4px}
.opt-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;display:block;margin-bottom:7px}
.color-opts{display:flex;flex-wrap:wrap;gap:10px 12px;margin-bottom:16px}
.qv-color-opts{margin-bottom:12px}
.col-btn-item{display:flex;flex-direction:column;align-items:center;gap:4px;max-width:64px}
.col-btn-item.on .col-btn-lbl{color:var(--gold);font-weight:600}
.col-btn{
  width:28px;height:28px;border-radius:50%;
  border:2px solid transparent;cursor:pointer;transition:all .2s;flex-shrink:0;
}
.col-btn.on{border-color:var(--gold);transform:scale(1.12);box-shadow:0 0 0 1px rgba(189,160,97,.35)}
.col-btn-lbl{font-size:8px;text-align:center;line-height:1.25;color:var(--muted);word-break:break-word;max-width:100%}
.size-opts{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}
.sz-btn{
  padding:7px 14px;border:1px solid var(--qty-border);background:none;
  color:var(--text-body);font-family:'Montserrat',sans-serif;
  font-size:10px;font-weight:600;cursor:pointer;border-radius:2px;transition:all .2s;
}
.sz-btn:hover{border-color:var(--text);color:var(--text)}
.sz-btn.on{background:var(--gold);color:#000;border-color:var(--gold)}
.qv-selection-box{
  background:var(--bg-card);border:1px solid var(--border-hard);
  border-radius:2px;padding:12px 14px;margin-bottom:16px;
}
.qv-selection-row{
  display:flex;justify-content:space-between;gap:12px;
  font-size:9px;color:var(--muted);margin-bottom:8px;
}
.qv-selection-row:last-of-type{margin-bottom:0}
.qv-selection-row strong{color:var(--text);font-size:10px}
.qv-selection-row.missing strong{color:var(--gold)}
.qv-selection-note{
  margin-top:10px;font-size:9px;line-height:1.5;color:var(--gold);
}
.qv-selection-note.ok{color:#22c55e}
.m-cta{margin-top:auto;display:flex;flex-direction:column;gap:7px}
.qv-added-ok{
  padding:12px 14px;border:1px solid rgba(34,197,94,.35);border-radius:2px;
  background:rgba(34,197,94,.08);margin-bottom:4px;
}
.qv-added-icon{display:inline-block;color:#22c55e;font-weight:700;margin-right:6px}
.qv-added-title{font-size:10px;font-weight:600;color:var(--text);margin:0 0 4px;line-height:1.5}
.qv-added-hint{font-size:9px;color:var(--muted);margin:0;line-height:1.55}
.qv-added-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.qv-act-btn{flex:1;min-width:120px;min-height:44px;text-align:center}
.btn-madd{
  background:var(--gold);color:#000;border:none;padding:15px;
  font-family:'Montserrat',sans-serif;
  font-size:9px;font-weight:800;letter-spacing:3px;text-transform:uppercase;
  cursor:pointer;border-radius:2px;transition:background .2s;
}
.btn-madd:hover{background:var(--gold-lt)}
.btn-madd.disabled,.btn-madd:disabled{
  background:#6f6240;color:#1a1a1a;cursor:not-allowed;opacity:.65;
}
.btn-mfav{
  background:transparent;color:var(--muted);border:1px solid var(--border-hard);
  padding:9px;font-family:'Montserrat',sans-serif;
  font-size:9px;cursor:pointer;border-radius:2px;transition:all .2s;
}
.btn-mfav:hover{color:var(--gold);border-color:var(--gold)}

/* size guide */
.size-guide-block{
  background:rgba(0,0,0,.25);border:1px solid var(--border-hard);
  padding:14px 12px;border-radius:2px;margin-bottom:12px;
}
.size-guide-block--compact{padding:12px 10px}
.size-guide-block--compact .size-guide-how-title{font-size:9px;margin-top:0}
.size-guide-block--compact .size-guide-steps li{font-size:9px}
.size-guide-block--compact .size-guide-table{font-size:8px}
.size-guide-block--compact .size-guide-tip,.size-guide-block--compact .size-guide-note{font-size:8px}
.size-guide-title{
  font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:500;
  color:var(--text);margin:0 0 4px;line-height:1.2;
}
.size-guide-sub{font-size:9px;color:var(--gold);margin:0 0 12px;line-height:1.5}
.size-guide-how-title{
  font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text);margin:0 0 6px;
}
.size-guide-steps{margin:0 0 12px;padding-left:18px}
.size-guide-steps li{font-size:10px;line-height:1.65;color:var(--text-body);margin:4px 0}
.size-guide-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:8px}
.size-guide-table{width:100%;border-collapse:collapse;font-size:9px;min-width:280px}
.size-guide-table th,.size-guide-table td{
  padding:7px 8px;border-bottom:1px solid var(--border-hard);
  text-align:left;vertical-align:top;
}
.size-guide-table th{
  font-size:8px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--gold);white-space:nowrap;
}
.size-guide-table td{color:var(--text-body)}
.size-guide-table td strong{color:var(--text)}
.size-guide-table tbody tr:hover td{background:rgba(201,169,110,.06)}
.size-guide-colhint{font-size:8px;color:var(--muted);margin:0 0 8px;line-height:1.5}
.size-guide-tip{
  font-size:9px;line-height:1.6;color:var(--text-body);margin:0 0 6px;
  padding:8px 10px;border-left:3px solid var(--gold);
  background:rgba(201,169,110,.08);
}
.size-guide-note{font-size:8px;color:var(--muted);margin:0;line-height:1.5}
.size-guide-one{font-size:10px;line-height:1.7;color:var(--text-body);margin:0}
.size-guide-modal{max-width:680px;width:100%;max-height:92vh;display:flex;flex-direction:column}
.size-guide-modal .size-guide-scroll{overflow-y:auto;max-height:calc(92vh - 48px);padding:28px 32px 36px}
.size-guide-modal .size-guide-block{background:transparent;border:none;padding:0;margin:0}
.info-hub-modal{
  max-width:960px;width:100%;max-height:92vh;display:flex;flex-direction:column;
  flex-wrap:nowrap;padding:0;overflow:hidden;
}
.info-hub-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 56px 14px 28px;border-bottom:1px solid var(--border-hard);flex-shrink:0;
}
.info-hub-head h2{
  font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:500;
  color:var(--text);margin:0;letter-spacing:.02em;line-height:1.25;
}
.info-hub-layout{display:flex;flex:1;min-height:0;overflow:hidden;width:100%}
.info-hub-nav{
  flex:0 0 240px;border-right:1px solid var(--border-hard);
  padding:16px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;
  flex-shrink:0;background:rgba(0,0,0,.12);
}
[data-theme="light"] .info-hub-nav{background:rgba(28,25,22,.04)}
.info-nav-btn{
  background:transparent;border:none;text-align:left;cursor:pointer;
  padding:12px 14px;border-radius:3px;font-family:'Montserrat',sans-serif;
  font-size:11px;line-height:1.45;letter-spacing:.04em;color:var(--text-body);
  transition:background .2s,color .2s,border-color .2s;
  border-left:3px solid transparent;white-space:normal;word-break:break-word;
}
a.info-nav-btn{display:block;text-decoration:none}
.acc-legal-link{color:var(--gold);text-decoration:underline}
.acc-legal-link:hover{color:var(--gold-lt)}
.info-nav-btn:hover{background:var(--icon-hover);color:var(--text)}
.info-nav-btn.on{
  color:var(--gold);background:rgba(201,169,110,.14);
  border-left-color:var(--gold);font-weight:600;
}
.info-hub-body{
  flex:1;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;
  padding:28px 32px 36px;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
.info-hub-body .legal-doc,.info-hub-body .info-doc-wrap{padding:0}
.info-hub-body .legal-doc h1{font-size:26px;margin:0 0 10px;line-height:1.25}
.info-hub-body .legal-doc h2{margin-top:22px;font-size:12px;line-height:1.45}
.info-hub-body .legal-doc p{font-size:13px;line-height:1.85;color:var(--text-body)}
.info-hub-body .legal-doc .legal-meta{font-size:11px;margin-bottom:20px;line-height:1.5}
.info-hub-body .size-guide-title{font-size:22px}
.info-hub-body .size-guide-sub,.info-hub-body .size-guide-how-title{font-size:11px}
.info-hub-body .size-guide-steps li{font-size:12px;line-height:1.75}
.info-hub-body .size-guide-table{font-size:11px}
.info-hub-body .size-guide-tip,.info-hub-body .size-guide-note{font-size:11px;line-height:1.7}
.info-doc-wrap .size-guide-block{background:transparent;border:none;padding:0;margin:0}
.info-promise{
  font-size:11px;line-height:1.65;color:var(--gold);margin:0 0 16px;
  padding:12px 16px;border:1px solid rgba(201,169,110,.35);
  background:rgba(201,169,110,.08);border-radius:3px;text-align:left;
  letter-spacing:.03em;
}
[data-theme="light"] .size-guide-block{background:rgba(28,25,22,.05)}
[data-theme="dark"] .size-guide-block{background:rgba(255,255,255,.05)}
@media(min-width:769px) and (max-width:1280px){
  .nav-ul{gap:clamp(8px,1.2vw,18px)}
  .nav-ul button{font-size:9px;letter-spacing:1.5px}
  .brand img.brand-logo{max-width:min(190px,30vw)}
  .nav-right{gap:4px}
  .lang-switch button{min-width:30px;padding:6px 7px;font-size:8px}
  .icon-btn{padding:8px}
}
@media(min-width:769px) and (max-width:1100px){
  .nav-ul{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;justify-content:flex-start;

  .nav-ul button{white-space:nowrap}

@media(max-width:768px){
  .info-hub-modal{
    max-width:none;width:100%;height:100%;min-height:100dvh;max-height:100dvh;

  }
  .info-hub-modal .modal-close{
    top:max(8px,env(safe-area-inset-top,0) + 4px);right:10px;
  }

  }
  .info-hub-head h2{
    font-size:clamp(17px,4.8vw,20px);line-height:1.2;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .info-hub-layout{
    flex:1 1 0;flex-direction:column;min-height:0;overflow:hidden;width:100%;
  }

    padding:6px 12px;gap:8px;-webkit-overflow-scrolling:touch;

  }
  .info-hub-nav::-webkit-scrollbar{display:none}
  .info-nav-btn{

    font-size:11px;line-height:1.35;letter-spacing:.03em;
    color:var(--text-body);
    -webkit-tap-highlight-color:transparent;
  }
  .info-nav-btn.on{border-left:none;border-bottom-color:var(--gold);background:rgba(201,169,110,.12)}
  .info-hub-body{
    flex:1 1 0;min-height:0;width:100%;
    padding:16px 16px calc(20px + env(safe-area-inset-bottom,0));
  }
  .info-hub-body .legal-doc h1{
    font-size:clamp(18px,5.2vw,22px);margin:0 0 6px;
  }
  .info-hub-body .legal-doc h2{
    font-size:clamp(10px,2.8vw,11px);margin-top:18px;line-height:1.4;
  }
  .info-hub-body .legal-doc p{
    font-size:clamp(13px,3.6vw,14px);line-height:1.75;
    word-wrap:break-word;overflow-wrap:anywhere;
  }
  .info-hub-body .legal-doc .legal-meta{font-size:10px;margin-bottom:14px}
  .info-hub-body .info-promise{
    font-size:clamp(11px,3.2vw,12px);padding:10px 12px;line-height:1.55;
    text-align:left;
  }
  .info-hub-body .size-guide-title{font-size:clamp(17px,4.6vw,20px)}
  .info-hub-body .size-guide-steps li{font-size:clamp(12px,3.4vw,13px)}
  .info-hub-body .size-guide-table-wrap{
    margin:0 -4px 10px;padding:0 4px;
  }
  .info-hub-body .size-guide-table{
    font-size:clamp(10px,2.9vw,11px);min-width:min(100%,280px);
  }
  .info-hub-body .size-guide-table th,.info-hub-body .size-guide-table td{
    padding:8px 6px;
  }
  .nav-info-sep,.nav-info-btn{display:none}
}
@media(max-width:480px){
  .info-hub-head{padding-right:48px;padding-left:14px}
  .info-hub-head h2{font-size:17px;max-width:calc(100vw - 100px)}
  .info-hub-nav{padding:6px 10px;gap:6px}
  .info-nav-btn{padding:10px 12px;font-size:9px;min-height:44px}
  .info-hub-body{padding:14px 14px calc(18px + env(safe-area-inset-bottom,0))}
}
@media(max-width:380px){
  .info-hub-head h2{font-size:16px}
  .info-nav-btn{padding:10px;font-size:8px;letter-spacing:.03em}
}
@media(max-width:768px) and (max-height:520px){
  .info-hub-head{padding-top:max(10px,env(safe-area-inset-top,0) + 6px);padding-bottom:8px}
  .info-hub-head h2{font-size:16px}
  .info-nav-btn{min-height:40px;padding:8px 12px}
  .info-hub-body .legal-doc h1{font-size:17px}
}

.checkout-modal:not(.info-hub-modal){max-width:640px}
.checkout-modal .m-body{width:100%}
.co-panel{width:100%;padding:28px 32px;box-sizing:border-box}
.form-title{
  font-size:9px;color:var(--gold);letter-spacing:3px;text-transform:uppercase;
  border-bottom:1px solid var(--border-hard);padding-bottom:8px;margin-bottom:14px;
}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.fgrid.one{grid-template-columns:1fr}
.fgrid.three{grid-template-columns:1fr 1fr 1fr}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.field input{
  background:var(--bg-card);border:1px solid var(--border-hard);

.acc-wrap{padding:28px 32px;max-height:85vh;overflow-y:auto}
.acc-tabs{display:flex;gap:0;margin-bottom:20px;border-bottom:1px solid var(--border-hard)}
.acc-tab{

  text-transform:uppercase;cursor:pointer;transition:all .25s;
}
.acc-tab:hover{color:var(--text)}
.acc-tab.on{color:var(--gold);border-bottom-color:var(--gold)}
.acc-hint{font-size:9px;color:var(--muted);line-height:1.6;margin-bottom:14px}
.acc-check{display:flex;align-items:flex-start;gap:8px;font-size:9px;color:var(--muted);margin:10px 0;cursor:pointer}
.acc-check input{accent-color:var(--gold);margin-top:2px}
.acc-link{background:none;border:none;color:var(--gold);font-size:9px;cursor:pointer;padding:0;text-decoration:underline;font-family:inherit}

.acc-dash-btn.on,.acc-dash-btn:hover{color:var(--gold);border-color:var(--gold)}

.acc-order-main{flex:1;cursor:pointer;min-width:0}
.acc-order:hover{border-color:var(--gold)}
.acc-order-id{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--gold)}
.btn-rc-mini{

.acc-addr{padding:10px;border:1px solid var(--border-hard);margin-bottom:8px;border-radius:2px;font-size:10px}
.acc-addr-actions{display:flex;gap:8px;margin-top:8px}
.btn-ghost-sm{

.order-ok{
  padding:44px 36px;width:100%;
  display:flex;flex-direction:column;align-items:center;
  text-align:center;gap:18px;animation:fadeUp .4s both;
}
.ok-emoji{font-size:52px}

.order-ref-card{

  border-radius:3px;padding:18px 20px;text-align:left;
}
.order-ref-label{
  font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;
}
.order-ref-row{
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
}
.order-ref-row strong{
  font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--text);
}
.order-ref-help{font-size:9px;color:var(--muted);line-height:1.6;margin-top:10px}
.btn-copy-ref,.btn-order-secondary{
  padding:10px 14px;border-radius:2px;font-family:'Montserrat',sans-serif;
  font-size:8px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;
}
.btn-copy-ref{
  background:transparent;border:1px solid var(--gold);color:var(--gold);
}
.btn-copy-ref:hover,.btn-order-secondary:hover{border-color:var(--gold);color:var(--gold)}
.order-ok-actions{
  width:100%;max-width:480px;display:flex;flex-direction:column;gap:10px;
}
.btn-order-secondary{
  background:transparent;border:1px solid var(--border-hard);color:var(--muted);
}
.receipt-card{
  width:100%;max-width:480px;margin:16px 0 0;text-align:left;
  background:var(--bg-card);border:1px solid var(--border-hard);border-radius:3px;overflow:hidden;
}
.rc-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 18px;border-bottom:1px solid var(--border-hard);
  background:var(--surface-elevated);
}
.rc-type{font-size:8px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);font-weight:700}
.rc-ref{font-size:11px;font-weight:600;color:var(--text)}
.rc-body{padding:14px 18px}
.rc-line{display:flex;justify-content:space-between;gap:12px;font-size:10px;padding:6px 0;border-bottom:1px solid var(--divider)}
.rc-line:last-of-type{border-bottom:none}
.rc-name{color:var(--text-body);flex:1;line-height:1.4}
.rc-amt{color:var(--text);font-weight:600;white-space:nowrap}
.rc-more{font-size:9px;color:var(--muted);margin-top:6px}
.rc-total{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--border-hard);font-size:10px}
.rc-total strong{font-size:14px;color:var(--gold)}
.rc-iva{color:var(--muted)}
.rc-disc{font-size:8px;color:var(--muted);line-height:1.45;margin-top:10px}
.rc-actions{display:flex;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--border-hard)}
.btn-rc{
  flex:1;padding:11px 10px;border:1px solid var(--gold);background:var(--gold);color:var(--on-gold);
  font-family:'Montserrat',sans-serif;font-size:8px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;cursor:pointer;border-radius:2px;
}
.btn-rc-ghost{background:transparent;color:var(--gold)}
.btn-rc:hover{opacity:.92}
.rc-loading{padding:20px 18px;font-size:10px;color:var(--muted);text-align:center}
.receipt-inline{margin-top:14px}
.tracking{
  background:var(--bg-card);border:1px solid var(--border-hard);
  border-radius:3px;padding:20px 22px;width:100%;max-width:480px;text-align:left;
}
.tr-title{font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:14px}
.tr-steps{position:relative;padding-left:22px}
.tr-steps::before{
  content:'';position:absolute;left:5px;top:6px;bottom:6px;
  width:1px;background:var(--tr-line);
}
.tr-step{position:relative;margin-bottom:14px}
.tr-step:last-child{margin-bottom:0}
.tr-dot{
  position:absolute;left:-22px;top:3px;
  width:11px;height:11px;border-radius:50%;
  background:var(--tr-dot);border:3px solid var(--bg-card);
  transition:background .6s;
}
.tr-dot.done{background:#22c55e;animation:pulse 1.5s infinite}
.tr-dot.current{background:var(--gold);box-shadow:0 0 0 3px rgba(201,169,110,.25)}
.tr-step-current h4{color:var(--gold)}
.tr-step h4{font-size:10px;font-weight:600}
.tr-step p{font-size:9px;color:var(--muted);margin-top:2px;line-height:1.5}
.tr-track-ref{font-size:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border-hard);color:var(--muted);line-height:1.5}
.tr-track-ref strong{color:var(--text);font-weight:600}

// UI SHELL (traductions i18n.js + catalogue erp-shop.js)
let lang = 'pt';
try {
  var _savedLang = localStorage.getItem('azav_lang');
  if (_savedLang && typeof T !== 'undefined' && T[_savedLang]) lang = _savedLang;
} catch (e) { /* ignore */ }
const $ = id => document.getElementById(id);

function updateLangButtons(l) {
  ['fr', 'pt', 'en', 'es'].forEach(function (code) {
    var btn = $('btn' + code.charAt(0).toUpperCase() + code.slice(1));
    if (btn) btn.classList.toggle('on', l === code);
  });
  var cur = $('langMiniCur');
  if (cur) cur.textContent = String(l || 'pt').toUpperCase();
  document.querySelectorAll('#langMiniMenu [data-lm]').forEach(function (b) {
    b.classList.toggle('on', b.getAttribute('data-lm') === l);
  });
}

function toggleLangMini(ev) {
  if (ev) { ev.stopPropagation(); ev.preventDefault(); }
  var box = $('langMini');
  if (!box) return;
  var open = box.classList.toggle('open');
  var btn = $('btnLangMini');
  if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
}

function closeLangMini() {
  var box = $('langMini');
  if (box) box.classList.remove('open');
  var btn = $('btnLangMini');
  if (btn) btn.setAttribute('aria-expanded', 'false');
}

window.toggleLangMini = toggleLangMini;
window.closeLangMini = closeLangMini;
document.addEventListener('click', function (ev) {
  var box = $('langMini');
  if (box && box.classList.contains('open') && !box.contains(ev.target)) closeLangMini();
});

function getTheme() {
  return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
}

function updateThemeButtons() {
  var th = getTheme();
  var tr = (typeof T !== 'undefined' && T[lang]) ? T[lang] : null;
  document.querySelectorAll('#btnThemeDark,[data-theme-btn="dark"]').forEach(function (btn) {
    btn.classList.toggle('on', th === 'dark');
    btn.setAttribute('aria-pressed', th === 'dark' ? 'true' : 'false');
    if (tr) btn.title = tr.themeDark || 'Dark';
  });
  document.querySelectorAll('#btnThemeLight,[data-theme-btn="light"]').forEach(function (btn) {
    btn.classList.toggle('on', th === 'light');
    btn.setAttribute('aria-pressed', th === 'light' ? 'true' : 'false');
    if (tr) btn.title = tr.themeLight || 'Light';
  });
  if (tr && $('lblThemeDark')) $('lblThemeDark').textContent = tr.themeDarkShort || tr.themeDark || 'Dark';
  if (tr && $('lblThemeLight')) $('lblThemeLight').textContent = tr.themeLightShort || tr.themeLight || 'Light';
  var box = $('themeBox');
  if (box && tr && tr.themeAria) box.setAttribute('aria-label', tr.themeAria);
}

function buildThemeSwitchHtml() {
  var th = getTheme();
  var tr = (typeof T !== 'undefined' && T[lang]) ? T[lang] : {};
  var ld = tr.themeDarkShort || tr.themeDark || 'Dark';
  var ll = tr.themeLightShort || tr.themeLight || 'Light';
  var aria = tr.themeAria || 'Appearance';
  return '<div class="theme-switch" role="group" aria-label="' + aria + '">' +
    '<button type="button" data-theme-btn="dark" class="' + (th === 'dark' ? 'on' : '') + '" aria-pressed="' + (th === 'dark' ? 'true' : 'false') + '" onclick="setTheme(\'dark\')" title="' + (tr.themeDark || 'Dark') + '">' +
    '<svg aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>' +
    '<span class="theme-lbl">' + ld + '</span></button>' +
    '<button type="button" data-theme-btn="light" class="' + (th === 'light' ? 'on' : '') + '" aria-pressed="' + (th === 'light' ? 'true' : 'false') + '" onclick="setTheme(\'light\')" title="' + (tr.themeLight || 'Light') + '">' +
    '<svg aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>' +
    '<span class="theme-lbl">' + ll + '</span></button></div>';
}
window.buildThemeSwitchHtml = buildThemeSwitchHtml;

function setTheme(theme) {
  theme = theme === 'light' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('azav_theme', theme); } catch (e) { /* ignore */ }
  var meta = $('metaThemeColor') || document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'light' ? '#f8f6f2' : '#0b0a09');
  updateThemeButtons();
  if (window.Shop && window.Shop.onThemeChange) window.Shop.onThemeChange(theme);
}

function toggleTheme() {
  setTheme(getTheme() === 'dark' ? 'light' : 'dark');
}
window.setTheme = setTheme;
window.toggleTheme = toggleTheme;
window.getTheme = getTheme;
updateThemeButtons();

function applyShopLang(l) {
  if (window._langSet || !T[l]) return;
  try { if (localStorage.getItem('azav_lang')) return; } catch (e) { /* ignore */ }
  lang = l;
  updateLangButtons(l);
  updateThemeButtons();
  boot();
}
window.applyShopLang = applyShopLang;

function setLang(l) {
  if (!T[l]) l = 'pt';
  lang = l;
  window._langSet = true;
  try { localStorage.setItem('azav_lang', l); } catch (e) { /* ignore */ }
  document.documentElement.lang = (window.htmlLangMap && window.htmlLangMap[l]) || l;
  if (window.Shop) window.Shop.setLang(l);
  updateLangButtons(l);
  updateThemeButtons();
  boot();
}

function boot() {
  const t = T[lang] || T.pt;
  document.documentElement.lang = (window.htmlLangMap && window.htmlLangMap[lang]) || lang;
  if ($('apiBanner') && t.apiBanner) $('apiBanner').innerHTML = t.apiBanner;
  if ($('shopLoader')) $('shopLoader').textContent = t.shopLoader;
  if ($('btnAccount')) $('btnAccount').title = t.navAccount;
  if ($('btnSearch')) $('btnSearch').title = t.navSearch;
  if ($('btnWish')) $('btnWish').title = t.navWish;
  if ($('btnCart')) $('btnCart').title = t.navCart;
  if ($('contactFab') && t.contact) $('contactFab').title = t.contact.navContact;
  updateThemeButtons();
  if ($('nwEmail') && t.fNwPH) $('nwEmail').placeholder = t.fNwPH;
  if (window.Shop && window.Shop.applyPromoBanner) {
    window.Shop.applyPromoBanner();
  } else {
    var promoBar = document.querySelector('.promo-bar');
    if (promoBar) promoBar.style.display = 'none';
    ['mq1', 'mq2', 'mq3', 'mq4'].forEach(function (id) { if ($(id)) $(id).textContent = ''; });
  }
  if (window.Shop && window.Shop.renderNav) {
    window.Shop.renderNav();
  } else if ($('navUl')) {
    $('navUl').innerHTML = t.nav.map(l =>
      `<li><button type="button" onclick="Shop.scrollShop()">${l}</button></li>`
    ).join('');
  }
  /* Hero + en-têtes vitrine : uniquement depuis la config admin (pas de texte marketing i18n par défaut). */
  var vitrineReady = window.Shop && window.Shop.isStoreConfigReady && window.Shop.isStoreConfigReady();
  if (!vitrineReady) {
    ['hEye', 'hTitle', 'hSub', 'hBtn1', 'hBtn2', 'secLabel', 'secTitle', 'fDesc'].forEach(function (id) {
      var el = $(id);
      if (!el) return;
      el.textContent = '';
      el.innerHTML = '';
      delete el.dataset.erp;
    });
    if (window.Shop && window.Shop.applyHeroLoadingState) window.Shop.applyHeroLoadingState();
  } else if (window.Shop && window.Shop.applyVitrineContent) {
    window.Shop.applyVitrineContent(lang);
  }
  if ($('scrollHint')) $('scrollHint').textContent = t.scrollHint;
  if ($('svcGrid') && window.Shop && Shop.applyServicesStrip) {
    Shop.applyServicesStrip();
  } else if ($('svcGrid')) {
    $('svcGrid').innerHTML = '';

  if (window.IconUi) {
    IconUi.wireSocialButton($('socInsta'), 'instagram');
    IconUi.wireSocialButton($('socPin'), 'pinterest');
    IconUi.wireSocialButton($('socTik'), 'tiktok');
    IconUi.wireSocialButton($('socFb'), 'facebook');

  if (vitrineReady) {
    /* secLabel / secTitle / fDesc déjà appliqués par applyVitrineContent */
  } else {
    if ($('secLabel')) $('secLabel').textContent = '';
    if ($('secTitle')) $('secTitle').textContent = '';
    if ($('fDesc')) $('fDesc').textContent = '';
  }
  if ($('seeAll')) $('seeAll').textContent = t.seeAll;
  if ($('srchIn')) $('srchIn').placeholder = t.srchPH;
  ['sd', 'sa', 'sds', 'sr'].forEach((id, i) => {
    const el = $(id);
    if (el) el.textContent = [t.sd, t.sa, t.sds, t.sr][i];
  });
  if ($('fShopT')) $('fShopT').textContent = t.fShopT;
  if ($('fSuppT')) $('fSuppT').textContent = t.fSuppT;
  if ($('fNwT')) $('fNwT').textContent = t.fNwT;
  if ($('fNwD')) $('fNwD').textContent = t.fNwD;
  if ($('fNwBtn')) $('fNwBtn').textContent = t.fNwBtn;
  if ($('fCopy')) $('fCopy').textContent = t.fCopy;
  if ($('fShopL') && window.Shop && window.Shop.renderFooterShop) {
    window.Shop.renderFooterShop();
  }
  if ($('fSuppL') && window.Shop && window.Shop.renderFooterSupport) {
    window.Shop.renderFooterSupport();
  } else if ($('fSuppL')) {
    $('fSuppL').innerHTML = t.fSupp.map(function (l, i) {
      var click = i === 0 ? 'Shop.openOrdersOrLogin()' : (i === 1 ? 'Shop.openInfo(\'delivery\')' : (i === 2 ? 'Shop.openInfo(\'returns\')' : (i === 3 ? 'Shop.openInfo(\'sizeguide\')' : (i === 4 ? 'Shop.openInfo(\'faq\')' : (i === 5 ? 'Shop.openInfo(\'care\')' : 'Shop.openContact()')))));
      return '<li><a href="#" onclick="event.preventDefault();' + click + '">' + l + '</a></li>';
    }).join('');
  }
  if ($('fLegal') && window.Shop && window.Shop.renderFooterLegal) {
    window.Shop.renderFooterLegal();
  } else if ($('fLegal')) {
    $('fLegal').innerHTML = t.fLegal.map(function (l, i) {
      var pages = ['terms', 'privacy', 'legal'];
      if (pages[i] === 'privacy') {
        return '<a href="privacy.html?lang=' + encodeURIComponent(lang) + '">' + l + '</a>';
      }
      return '<a href="#" onclick="event.preventDefault();Shop.openInfo(\'' + pages[i] + '\')">' + l + '</a>';
    }).join('');
  }
  if ($('soLbl')) $('soLbl').textContent = t.soLbl;
  if ($('soIn')) $('soIn').placeholder = t.soPH;
  if ($('soHint')) $('soHint').textContent = t.soHint;
  if ($('cartDTitle')) $('cartDTitle').innerHTML = `${t.cartT} <span class="dh-n" id="cDN">0</span>`;
  if ($('wishDTitle')) $('wishDTitle').innerHTML = `${t.wishT} <span class="dh-n" id="wDN">0</span>`;
  if (window.Shop && window.Shop.applyVitrineContent) window.Shop.applyVitrineContent(lang);
  if (window.Shop) {
    window.Shop.renderCats && window.Shop.renderCats();
    window.Shop.render && window.Shop.render();
  }
}

function scrollShop() {
  if (window.Shop && window.Shop.scrollShop) window.Shop.scrollShop();
  else if ($('shop')) $('shop').scrollIntoView({ behavior: 'smooth' });
}

function openSearch() {
  if (window.Shop && window.Shop.openSearchOverlay) Shop.openSearchOverlay();
}
function closeSo() {
  if (window.Shop && window.Shop.closeSearchOverlay) Shop.closeSearchOverlay();
}
function soKey(e) {
  if (window.Shop && window.Shop.handleSearchOverlayKey) Shop.handleSearchOverlayKey(e);
}
function syncSo() {
  if (window.Shop && window.Shop.syncSearchFromOverlay) Shop.syncSearchFromOverlay();
}

let _tt;
function toast(msg, type = 's') {
  const el = $('toastEl');
  el.textContent = msg;
  el.className = `toast ${type}`;
  clearTimeout(_tt);
  _tt = setTimeout(() => el.classList.add('hide'), 3000);
}

updateThemeButtons();
updateLangButtons(lang);
boot();
</script>
